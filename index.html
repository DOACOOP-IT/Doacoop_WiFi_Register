<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Registration | สหกรณ์ออมทรัพย์กรมวิชาการเกษตร จำกัด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Sarabun', sans-serif !important; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient-start: #f8fafc;
            --bg-gradient-end: #e2e8f0;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f1f5f9;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; margin: 0;
        }

        .login-card {
            background: var(--card-bg); width: 100%; max-width: 420px;
            padding: 2.5rem; border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section { text-align: center; margin-bottom: 1.5rem; }
        .logo-section img { width: 100px; height: auto; border-radius: 1rem; }
        .header-text { text-align: center; margin-bottom: 2rem; }
        .header-text h1 { color: var(--text-main); font-size: 1.5rem; font-weight: 700; margin: 0; }
        .header-text p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.5rem; }
        
        input {
            width: 100%; padding: 0.75rem 1rem; background: var(--input-bg);
            border: 2px solid transparent; border-radius: 0.75rem; font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        input[readonly] { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

        /* --- Select Card Style --- */
        .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
        .role-card input { display: none; }
        .role-card label {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 5px; border: 2px solid #e2e8f0; border-radius: 1rem;
            background: #fff; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .role-card label span.icon { font-size: 1.5rem; margin-bottom: 4px; }
        .role-card label span.text { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        
        .role-card input:checked + label {
            border-color: var(--primary); background-color: #eff6ff;
            transform: translateY(-3px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .role-card input:checked + label span.text { color: var(--primary); }

        .btn-submit {
            width: 100%; background: var(--primary); color: white; padding: 0.875rem;
            border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; margin-top: 1rem;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* --- Alert Popup --- */
        .alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .alert-box {
            background: white; padding: 2rem; border-radius: 1.25rem; width: 90%; max-width: 340px;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .alert-icon { font-size: 3.5rem; margin-bottom: 1rem; }
        .alert-msg { font-weight: 600; color: var(--text-main); margin-bottom: 1.5rem; white-space: pre-line; }
        .alert-btn {
            background: var(--primary); color: white; border: none; padding: 0.6rem 2rem;
            border-radius: 0.5rem; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <img src="https://lh3.googleusercontent.com/d/1kKnX_mNnoqCIqJnamzFBYKSmNUT6D6j5" alt="Logo">
        </div>
        <div class="header-text">
            <h1>ลงทะเบียนเข้าใช้งาน</h1>
            <p>กรุณากรอกข้อมูลเพื่อขอรับสิทธิ์ใช้งาน Wi-Fi</p>
        </div>

        <form id="regForm">
            <div class="form-group">
                <label>ระบุสถานะของคุณ</label>
                <div class="role-grid">
                    <div class="role-card">
                        <input type="radio" name="role" id="r1" value="เจ้าหน้าที่" required>
                        <label for="r1"><span class="icon">💻</span><span class="text">เจ้าหน้าที่</span></label>
                    </div>
                    <div class="role-card">
                        <input type="radio" name="role" id="r2" value="คณะกรรมการ">
                        <label for="r2"><span class="icon">👔</span><span class="text">กรรมการ</span></label>
                    </div>
                    <div class="role-card">
                        <input type="radio" name="role" id="r3" value="ผู้มาติดต่อ">
                        <label for="r3"><span class="icon">🤝</span><span class="text">ติดต่อ</span></label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>ชื่อ-นามสกุล</label>
                <input type="text" name="fullName" placeholder="กรอกชื่อและนามสกุล" required>
            </div>

            <div class="form-group">
                <label>หมายเลขโทรศัพท์</label>
                <input type="tel" name="phone" placeholder="0XXXXXXXXX" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>MAC Address</label>
                <input type="text" id="mac" name="mac" readonly>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">ยืนยันข้อมูล</button>
        </form>
    </div>

    <div id="alertOverlay" class="alert-overlay">
        <div class="alert-box">
            <div id="alertIcon" class="alert-icon"></div>
            <div id="alertMsg" class="alert-msg"></div>
            <button class="alert-btn" onclick="closeAlert()">ตกลง</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('mac').value = params.get('mac') || "ไม่พบข้อมูลอุปกรณ์";

        const scriptURL = 'https://script.google.com/macros/s/AKfycbziQ_3o6WyTnMgP3n84zzUm2kYRfF9HvM4xBiJQkspVdWgDKbQtj9MkHpqnOnWk6io_/exec';
        
        function showAlert(msg, type) {
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertIcon').innerText = (type === 'success' ? '✅' : '❌');
            document.getElementById('alertOverlay').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('alertOverlay').style.display = 'none';
        }

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึกข้อมูล...';

            fetch(scriptURL, { method: 'POST', body: new FormData(this)})
            .then(res => {
                showAlert('บันทึกข้อมูลสำเร็จ!\nกรุณารอเจ้าหน้าที่ตรวจสอบและเปิดสิทธิ์ใช้งาน', 'success');
                document.getElementById('regForm').reset();
                btn.disabled = false;
                btn.innerText = 'ยืนยันข้อมูล';
            })
            .catch(err => {
                showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อ\nกรุณาลองใหม่อีกครั้ง', 'error');
                btn.disabled = false;
                btn.innerText = 'ยืนยันข้อมูล';
            });
        });
    </script>
</body>
</html>
