<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน WiFi Doacoop_Officer</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary-blue: #0056b3; 
      --soft-blue: #e7f1ff; 
      --text-main: #333333;
      --text-muted: #6c757d;
      --border-color: #dce4ec;
    }
    
    body { 
      font-family: 'Kanit', sans-serif; 
      background-color: #f4f7f6; 
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
    }

    /* Animation เฟดหน้าจอขึ้นมาอย่างนุ่มนวล */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container { 
      background: #ffffff; 
      padding: 40px 30px; 
      border-radius: 20px; /* ขอบโค้งมนสไตล์มินิมอล */
      box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
      width: 100%; max-width: 420px;
      animation: fadeInUp 0.6s ease-out;
    }

    /* --- ส่วน Logo --- */
    .logo-wrapper {
      text-align: center;
      margin-bottom: 25px;
    }
    .logo-wrapper img {
      max-width: 150px; /* ปรับขนาดโลโก้ตามความเหมาะสม */
      height: auto;
      display: inline-block;
    }
    /* --- สิ้นสุดส่วน Logo --- */

    h2 { 
      color: var(--primary-blue); text-align: center; 
      margin-top: 0; margin-bottom: 8px; font-weight: 600; font-size: 24px;
    }
    .subtitle {
      text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 25px;
    }

    .form-group { margin-bottom: 20px; }
    
    label { 
      display: block; margin-bottom: 8px; color: var(--text-main); font-size: 14px; font-weight: 500;
    }

    input[type="text"], input[type="tel"] { 
      width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); 
      border-radius: 12px; box-sizing: border-box; font-size: 15px; 
      font-family: 'Kanit', sans-serif; transition: all 0.3s ease;
    }
    input:focus { 
      outline: none; border-color: var(--primary-blue); background-color: #fcfdfe;
      box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
    }
    input[readonly] {
      background-color: #f8f9fa; color: var(--text-muted); cursor: not-allowed; border-color: #e9ecef;
    }

    /* --- สไตล์ของ Select Card --- */
    .role-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .role-card input[type="radio"] { display: none; }
    .role-card label {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px 8px; border: 2px solid var(--border-color); border-radius: 16px;
      background: #ffffff; cursor: pointer; text-align: center;
      transition: all 0.3s ease; margin: 0;
    }
    .role-card label span.icon { font-size: 24px; margin-bottom: 6px; }
    .role-card label span.text { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    
    /* เอฟเฟกต์เมื่อโฮเวอร์และเมื่อถูกเลือก */
    .role-card label:hover { border-color: #cbd5e1; background: #f8fafc; }
    .role-card input[type="radio"]:checked + label {
      border-color: var(--primary-blue); background-color: #eaf3fb;
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.12); transform: translateY(-2px);
    }
    .role-card input[type="radio"]:checked + label span.text { color: var(--primary-blue); font-weight: 600; }

    .consent-box { 
      background: var(--soft-blue); padding: 15px; border-radius: 12px; font-size: 13px; 
      color: var(--text-main); margin-bottom: 25px; border-left: 4px solid var(--primary-blue); line-height: 1.6;
    }
    
    .checkbox-wrapper { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 25px; cursor: pointer; }
    .checkbox-wrapper input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--primary-blue); margin-top: 2px;
    }
    .checkbox-wrapper span { font-size: 14px; color: var(--text-main); font-weight: 500; }

    button { 
      width: 100%; padding: 16px; background: var(--primary-blue); color: white; border: none; 
      border-radius: 14px; font-size: 16px; font-weight: 500; font-family: 'Kanit', sans-serif; 
      cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0, 86, 179, 0.15);
    }
    button:hover { background: #004494; transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0, 86, 179, 0.25); }
    button:disabled { background: #b3d1f2; cursor: not-allowed; transform: none; box-shadow: none; }
    
    #message { 
      text-align: center; margin-top: 20px; color: var(--primary-blue); font-weight: 500; 
      display: none; padding: 15px; background: var(--soft-blue); border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="logo-wrapper">
      <img src="https://lh3.googleusercontent.com/d/1kKnX_mNnoqCIqJnamzFBYKSmNUT6D6j5" alt="Coop Logo">
    </div>
    
    <h2>ลงทะเบียน Wi-Fi</h2>
    <div class="subtitle">ระบบรักษาความปลอดภัยเครือข่ายองค์กร</div>
    
    <form id="wifiForm">
      
      <div class="form-group">
        <label>สถานะผู้ใช้งาน</label>
        <div class="role-grid">
          <div class="role-card">
            <input type="radio" name="role" id="role_officer" value="เจ้าหน้าที่" required>
            <label for="role_officer">
              <span class="icon">💻</span>
              <span class="text">เจ้าหน้าที่</span>
            </label>
          </div>
          <div class="role-card">
            <input type="radio" name="role" id="role_committee" value="คณะกรรมการ">
            <label for="role_committee">
              <span class="icon">👔</span>
              <span class="text">คณะกรรมการ</span>
            </label>
          </div>
          <div class="role-card">
            <input type="radio" name="role" id="role_visitor" value="ผู้มาติดต่อ">
            <label for="role_visitor">
              <span class="icon">🤝</span>
              <span class="text">ผู้มาติดต่อ</span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>ชื่อ (ไม่ต้องระบุคำนำหน้า)</label>
        <input type="text" name="firstName" placeholder="กรอกชื่อของคุณ" required>
      </div>
      
      <div class="form-group">
        <label>นามสกุล</label>
        <input type="text" name="lastName" placeholder="กรอกนามสกุล" required>
      </div>
      
      <div class="form-group">
        <label>หมายเลขโทรศัพท์</label>
        <input type="tel" name="phone" placeholder="ตัวอย่าง 0958493535" required pattern="[0-9]{10}">
      </div>
      
      <div class="form-group">
        <label>MAC Address (ดึงข้อมูลอัตโนมัติ)</label>
        <input type="text" id="macAddress" name="macAddress" readonly required>
      </div>
      
      <div class="consent-box">
        <strong>ข้อตกลงการใช้งาน:</strong> ข้าพเจ้ายินยอมปฏิบัติตามระเบียบการใช้งานเครือข่ายคอมพิวเตอร์ และจะไม่นำไปใช้ในทางที่เกิดความเสียหายต่อระบบ
      </div>
      
      <label class="checkbox-wrapper">
        <input type="checkbox" id="consent" name="consent" required>
        <span>ข้าพเจ้ายินยอมและขอลงทะเบียนเข้าใช้งาน</span>
      </label>
      
      <button type="submit" id="submitBtn">ยืนยันการลงทะเบียน</button>
    </form>
    
    <div id="message"></div>
  </div>

  <script>
    // 1. ดึงค่า MAC Address จาก URL อัตโนมัติ
    const urlParams = new URLSearchParams(window.location.search);
    const macFromUrl = urlParams.get('mac');
    
    if (macFromUrl) {
      document.getElementById('macAddress').value = macFromUrl;
    } else {
      document.getElementById('macAddress').value = "ไม่พบข้อมูล กรุณาเชื่อมต่อผ่านระบบ";
    }

    // 2. ใส่ URL ของ Google Apps Script (Web App URL)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbziQ_3o6WyTnMgP3n84zzUm2kYRfF9HvM4xBiJQkspVdWgDKbQtj9MkHpqnOnWk6io_/exec';
    
    const form = document.forms['wifiForm'];
    const btn = document.getElementById('submitBtn');
    const msgDiv = document.getElementById('message');

    // 3. จัดการตอนกดปุ่ม Submit
    form.addEventListener('submit', e => {
      e.preventDefault();
      
      if(!macFromUrl) {
        alert("กรุณาเชื่อมต่อ Wi-Fi ของสหกรณ์ฯ เพื่อให้ระบบดึงข้อมูล MAC Address อัตโนมัติ");
        return;
      }

      btn.disabled = true;
      btn.innerText = 'กำลังส่งข้อมูล...';

      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          form.style.display = 'none';
          msgDiv.innerText = 'บันทึกข้อมูลเรียบร้อยแล้ว กรุณารอเจ้าหน้าที่ตรวจสอบและเปิดให้ใช้งานเน็ตเวิร์ก';
          msgDiv.style.display = 'block';
        })
        .catch(error => {
          console.error('Error!', error.message);
          btn.disabled = false;
          btn.innerText = 'ยืนยันการลงทะเบียน';
          alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหมีกครั้ง');
        });
    });
  </script>
</body>
</html>
