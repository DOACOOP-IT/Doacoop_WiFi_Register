<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WiFi Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
* { font-family: 'Sarabun', sans-serif !important; box-sizing: border-box; }

body {
    background: linear-gradient(135deg,#f8fafc,#e2e8f0);
    height:100vh; display:flex; align-items:center; justify-content:center;
    margin:0; padding:10px;
}

.login-card {
    background:#fff; width:100%; max-width:400px;
    padding:1.5rem; border-radius:1.5rem;
    box-shadow:0 20px 25px -5px rgba(0,0,0,.1);
}

.form-group { margin-bottom:.7rem; }

label { font-size:.85rem; font-weight:600; }

input {
    width:100%; padding:.65rem 1rem;
    background:#f1f5f9;
    border:2px solid transparent;
    border-radius:.75rem;
    transition:.2s;
}

input:focus {
    outline:none;
    border-color:#2563eb;
    background:#fff;
}

/* ✅ highlight */
.input-error {
    border-color:#ef4444 !important;
    background:#fef2f2 !important;
}

.role-error {
    border:2px solid #ef4444;
    border-radius:1rem;
    padding:5px;
}

.btn-submit {
    width:100%;
    background:#2563eb;
    color:#fff;
    padding:.8rem;
    border:none;
    border-radius:.8rem;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="login-card">
<form id="regForm">

<div class="form-group">
<label>ชื่อ-นามสกุล</label>
<input type="text" id="fullName" required>
</div>

<div class="form-group">
<label>เบอร์โทร</label>
<input type="tel" id="phone" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="0XXXXXXXXX" required>
</div>

<div class="form-group">
<label>สถานะ</label>
<div class="role-grid">
<label><input type="radio" name="role"> เจ้าหน้าที่</label>
<label><input type="radio" name="role"> กรรมการ</label>
<label><input type="radio" name="role"> ผู้มาติดต่อ</label>
</div>
</div>

<label>
<input type="checkbox" id="consent"> ยอมรับเงื่อนไข
</label>

<br><br>

<button type="submit" class="btn-submit">ยืนยัน</button>

</form>
</div>

<script>
const form = document.getElementById('regForm');
const fullName = document.getElementById('fullName');
const phone = document.getElementById('phone');
const consent = document.getElementById('consent');
const roleGrid = document.querySelector('.role-grid');

/* =========================
   🔧 helper แสดง error
========================= */
function showError(el, msg){
    document.querySelectorAll('.input-error').forEach(e=>e.classList.remove('input-error'));
    document.querySelectorAll('.role-error').forEach(e=>e.classList.remove('role-error'));

    if(el.classList) el.classList.add('input-error');

    el.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>el.focus(),300);

    Swal.fire({
        icon:'warning',
        title:msg,
        confirmButtonColor:'#2563eb'
    });
}

/* =========================
   🔧 ลบ error ตอนพิมพ์
========================= */
function clearErrorOnInput(el){
    el.addEventListener('input',()=> el.classList.remove('input-error'));
    el.addEventListener('change',()=> el.classList.remove('input-error'));
}

clearErrorOnInput(fullName);
clearErrorOnInput(phone);
clearErrorOnInput(consent);

document.querySelectorAll('input[name="role"]').forEach(r=>{
    r.addEventListener('change',()=>{
        roleGrid.classList.remove('role-error');
    });
});

/* =========================
   🚀 submit validation
========================= */
form.addEventListener('submit',function(e){
    e.preventDefault();

    const role = document.querySelector('input[name="role"]:checked');

    // ชื่อ
    if(!fullName.value.trim()){
        showError(fullName,'กรุณากรอกชื่อ');
        return;
    }

    // เบอร์
    if(!phone.value.trim()){
        showError(phone,'กรุณากรอกเบอร์');
        return;
    }

    if(!/^[0-9]{10}$/.test(phone.value)){
        showError(phone,'เบอร์ต้อง 10 หลัก');
        return;
    }

    // role
    if(!role){
        roleGrid.classList.add('role-error');
        roleGrid.scrollIntoView({behavior:'smooth',block:'center'});

        Swal.fire({
            icon:'warning',
            title:'กรุณาเลือกสถานะ',
            confirmButtonColor:'#2563eb'
        });
        return;
    }

    // consent
    if(!consent.checked){
        showError(consent,'กรุณายอมรับเงื่อนไข');
        return;
    }

    // success
    Swal.fire({
        icon:'success',
        title:'สำเร็จ'
    });

});
</script>

</body>
</html>
